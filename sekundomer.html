<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Секундомер</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111318;
      color: #f5f7fa;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    main {
      text-align: center;
      pointer-events: none;
      padding: 24px;
    }
    #time {
      font-size: clamp(3rem, 13vw, 8rem);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      letter-spacing: -0.06em;
    }
    #status {
      margin-top: 18px;
      color: #a7adba;
      font-size: clamp(0.9rem, 2.5vw, 1.1rem);
    }
    #hint {
      margin-top: 10px;
      color: #6f7786;
      font-size: 0.85rem;
    }
    body.running #status { color: #7ee0a3; }
    body.stopped #status { color: #ffcc80; }
  </style>
</head>
<body>
  <main>
    <div id="time" aria-live="off">00:00.00</div>
    <div id="status">Коснитесь экрана, чтобы начать</div>
    <div id="hint">Касание: старт → стоп → сброс и старт → стоп</div>
  </main>

  <script>
    const timeElement = document.getElementById("time");
    const statusElement = document.getElementById("status");

    let running = false;
    let startedAt = 0;
    let elapsedBeforeStart = 0;
    let animationId = null;

    function formatTime(milliseconds) {
      const totalCentiseconds = Math.floor(milliseconds / 10);
      const minutes = Math.floor(totalCentiseconds / 6000);
      const seconds = Math.floor((totalCentiseconds % 6000) / 100);
      const centiseconds = totalCentiseconds % 100;

      return `${String(minutes).padStart(2, "0")}:` +
             `${String(seconds).padStart(2, "0")}.` +
             `${String(centiseconds).padStart(2, "0")}`;
    }

    function render() {
      const elapsed = elapsedBeforeStart + (performance.now() - startedAt);
      timeElement.textContent = formatTime(elapsed);
      if (running) animationId = requestAnimationFrame(render);
    }

    function startFromZero() {
      elapsedBeforeStart = 0;
      startedAt = performance.now();
      running = true;
      document.body.classList.add("running");
      document.body.classList.remove("stopped");
      statusElement.textContent = "Секундомер работает";
      cancelAnimationFrame(animationId);
      render();
    }

    function stop() {
      elapsedBeforeStart += performance.now() - startedAt;
      running = false;
      cancelAnimationFrame(animationId);
      timeElement.textContent = formatTime(elapsedBeforeStart);
      document.body.classList.remove("running");
      document.body.classList.add("stopped");
      statusElement.textContent = "Остановлено — коснитесь, чтобы сбросить и начать заново";
    }

    document.body.addEventListener("pointerdown", () => {
      if (running) {
        stop();
      } else {
        startFromZero();
      }
    });
  </script>
</body>
</html>
